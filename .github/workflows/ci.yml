name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate release versioning
        run: node scripts/bump-release-version.mjs --dry-run

      - name: Type and Svelte checks
        run: npm run check

      - name: Build Chrome extension
        run: npm run build:chrome

      - name: Build Firefox extension
        run: npm run build:firefox

      - name: Lint Firefox extension
        run: npm run lint:firefox

      - name: Package Firefox extension
        run: node scripts/package-firefox.mjs

      - name: Package Firefox source
        run: node scripts/package-firefox-source.mjs

      - name: Upload Firefox packages
        uses: actions/upload-artifact@v4
        with:
          name: firefox-packages
          path: artifacts/firefox/
          if-no-files-found: error

      - name: Build native companion
        run: dotnet build native/ContextTabManager.NativeHost/ContextTabManager.NativeHost.csproj --configuration Release
